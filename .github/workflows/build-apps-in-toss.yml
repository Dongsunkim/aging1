name: 앱인토스 번들 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps-in-toss/**"
      - "index.html"
      - "style.css"
      - "app.js"
      - "image-security.js"
      - "age-reliability.js"
      - "skin-personalization.js"
      - "tests/**"
      - "verdict.js"
      - "visual-analysis.js"
      - "appearance-feedback.js"
      - ".github/workflows/build-apps-in-toss.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps-in-toss
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 24 설치
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps-in-toss/package.json
      - name: 의존성 설치
        run: npm install --no-audit --no-fund
      - name: 사진 보안 검사 테스트
        run: node --test ../tests/*.test.mjs
      - name: 의존성 고위험 취약점 검사
        run: npm audit --omit=dev --audit-level=high
      - name: 미니앱 번들 생성
        run: npm run build
      - name: 빌드 결과 확인
        run: |
          find . -name "*.ait" -type f -print
          find . -name "*.ait" -type f | grep -q .
      - name: 앱 번들 다운로드용 아티팩트 저장
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agingwonder-ait-security
          path: apps-in-toss/**/*.ait
          if-no-files-found: error
          retention-days: 14
